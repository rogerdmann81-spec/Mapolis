<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08123b" />
      <stop offset="100%" stop-color="#04081c" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700" />
      <stop offset="100%" stop-color="#ff9900" />
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffff" />
      <stop offset="100%" stop-color="#0088cc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <!-- Outer Globe Ring -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="url(#cyan)" stroke-width="6" opacity="0.6" />
  <circle cx="256" cy="256" r="160" fill="#060e28" stroke="url(#gold)" stroke-width="4" />
  <!-- Latitude & Longitude Arcs -->
  <ellipse cx="256" cy="256" rx="160" ry="64" fill="none" stroke="url(#cyan)" stroke-width="3" stroke-dasharray="6 4" opacity="0.5" />
  <ellipse cx="256" cy="256" rx="72" ry="160" fill="none" stroke="url(#cyan)" stroke-width="3" opacity="0.4" />
  <line x1="96" y1="256" x2="416" y2="256" stroke="url(#cyan)" stroke-width="3" opacity="0.5" />
  <line x1="256" y1="96" x2="256" y2="416" stroke="url(#cyan)" stroke-width="3" opacity="0.5" />
  <!-- Center Stylized M Monogram -->
  <path d="M 170 340 L 170 190 L 256 280 L 342 190 L 342 340" fill="none" stroke="url(#gold)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <!-- Compass Star Accents -->
  <circle cx="256" cy="116" r="6" fill="#ffd700" />
  <circle cx="256" cy="396" r="6" fill="#ffd700" />
  <circle cx="116" cy="256" r="6" fill="#00ffff" />
  <circle cx="396" cy="256" r="6" fill="#00ffff" />
</svg>