[build]
  publish = "."

[dev]
  port = 3000
  framework = "#static"
  publish = "."

[[redirects]]
  from = "/api/request-recovery"
  to = "/.netlify/functions/request-recovery"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/admin/"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/"
  to = "/play/"
  status = 301
