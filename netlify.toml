[build]
  publish = "."

[dev]
  port = 3000
  framework = "#static"
  publish = "."

[[redirects]]
  from = "/api/parent-consent"
  to = "/.netlify/functions/parent-consent"
  status = 200

[[redirects]]
  from = "/api/parent-opt-out"
  to = "/.netlify/functions/parent-opt-out"
  status = 200

[[redirects]]
  from = "/api/send-welcome-notice"
  to = "/.netlify/functions/send-welcome-notice"
  status = 200

[[redirects]]
  from = "/api/request-recovery"
  to = "/.netlify/functions/request-recovery"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/play/admin/index.html"
  status = 200

[[redirects]]
  from = "/admin/"
  to = "/play/admin/index.html"
  status = 200

[[redirects]]
  from = "/play/admin"
  to = "/play/admin/index.html"
  status = 200

[[redirects]]
  from = "/play/admin/"
  to = "/play/admin/index.html"
  status = 200

[[redirects]]
  from = "/"
  to = "/play/"
  status = 301
